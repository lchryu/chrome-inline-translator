<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inline Quick Translate Settings</title>
    <link rel="stylesheet" href="./options.css">
  </head>
  <body>
    <main class="settings">
      <h1>Inline Quick Translate</h1>

      <form id="settings-form">
        <label>
          Translation provider
          <select name="provider">
            <option value="auto">Auto recommended</option>
            <option value="mock">Mock test</option>
            <option value="google">Google Cloud Translation</option>
            <option value="gemini">Gemini</option>
            <option value="openai">OpenAI</option>
          </select>
        </label>

        <label>
          AI reading provider
          <select name="aiProvider">
            <option value="gemini">Gemini</option>
            <option value="openai">OpenAI</option>
            <option value="auto">Auto from configured providers</option>
          </select>
        </label>

        <label>
          Source language
          <input name="sourceLanguage" placeholder="auto" autocomplete="off">
        </label>

        <label>
          Target language
          <input name="targetLanguage" placeholder="vi" autocomplete="off">
        </label>

        <label>
          Translation placement
          <select name="placementMode">
            <option value="inline">Inline with brackets</option>
            <option value="compact">Compact inline</option>
            <option value="block">Block below selection</option>
          </select>
        </label>

        <label class="checkbox-row">
          <input name="autoFallback" type="checkbox">
          Auto fallback to another configured provider
        </label>

        <label class="checkbox-row">
          <input name="saveHistory" type="checkbox">
          Save translation history and vocabulary
        </label>

        <label data-provider-field="google">
          Google API key
          <input name="googleApiKey" type="password" autocomplete="off">
        </label>

        <label data-provider-field="openai">
          OpenAI API key
          <input name="openaiApiKey" type="password" autocomplete="off">
        </label>

        <label data-provider-field="openai">
          OpenAI model
          <input name="openaiModel" placeholder="gpt-4o-mini" autocomplete="off">
        </label>

        <label data-provider-field="gemini">
          Gemini API key
          <input name="geminiApiKey" type="password" autocomplete="off">
        </label>

        <label data-provider-field="gemini">
          Gemini model
          <input name="geminiModel" placeholder="gemini-3.1-flash-lite" autocomplete="off">
        </label>

        <div class="button-row">
          <button type="submit">Save</button>
          <button id="test-provider" type="button" class="secondary">Test provider</button>
          <button id="clear-cache" type="button" class="secondary">Clear cache</button>
          <button id="clear-history" type="button" class="secondary">Clear history</button>
        </div>
        <p id="status" role="status"></p>
      </form>
    </main>

    <script type="module" src="./options.js"></script>
  </body>
</html>
